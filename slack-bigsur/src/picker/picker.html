<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:"
    />
    <link rel="stylesheet" href="picker.css" />
    <title></title>
  </head>
  <body>
    <header>
      <h1 id="title"></h1>
    </header>
    <div id="permission" class="notice" hidden>
      <p id="permission-text"></p>
      <button id="open-settings" type="button"></button>
    </div>
    <main id="content">
      <section id="screens-section" hidden>
        <h2 id="screens-heading"></h2>
        <div id="screens" class="grid" role="listbox"></div>
      </section>
      <section id="windows-section" hidden>
        <h2 id="windows-heading"></h2>
        <div id="windows" class="grid" role="listbox"></div>
      </section>
      <p id="empty" class="empty" hidden></p>
    </main>
    <footer>
      <button id="cancel" type="button"></button>
      <button id="share" type="button" class="primary" disabled></button>
    </footer>
    <script src="picker.js"></script>
  </body>
</html>
